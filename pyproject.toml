[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "receipt-pair"
version = "0.1.0"
description = "Two small local models, served by Lemonade, check whether an AI agent's \"done\" is true against its own logs."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Joshua Bauer", email = "joshua@jdbauer.ca" }]
keywords = ["AI agents", "verification", "Lemonade", "local models", "receipts"]
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Intended Audience :: Developers",
]
dependencies = []

[project.urls]
Repository = "https://github.com/ISWT42/receipt-pair"

[project.scripts]
receipt-pair = "receipt_pair.cli:main"

[tool.setuptools]
packages = ["receipt_pair"]
